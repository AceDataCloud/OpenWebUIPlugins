name: CI

on:
  push:
  pull_request:

jobs:
  plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'httpx>=0.27,<1' 'pydantic>=2,<3'
      - run: python scripts/generate_service_tools.py --check
      - run: python scripts/build_community_materials.py --check
      - run: python -m compileall -q functions tools scripts
      - run: python -m unittest discover -s tests -v
